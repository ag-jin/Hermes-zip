# Build and VERIFY a self-contained "bundled" Hermes Desktop app for Intel macOS.
#
# Two problems this lane fixes, both seen in earlier attempts:
#
# 1. Identity. Building with --commit pins HERMES_BUILD_COMMIT, which gives the
#    app an isolated identity ("Hermes Agent <sha>", userData and bootstrap
#    marker included) that never reaches a normal first-launch flow. A canary
#    --tag is a real release identity ("Hermes Agent Canary"), so the app
#    behaves like a shipped build.
# 2. Verification. A packaged .app is not proven by "it exists". The in-tree
#    smoke harness installs the artifact, verifies its identity, seeds an
#    isolated home and drives a real chat turn through Playwright. The Release
#    is only published when that passes.
name: Desktop bundled (macOS x64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Canary release tag to build (empty = newest v*+canary tag)'
        type: string
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: desktop-bundled-macos-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Bundle and smoke Hermes.app (macos-15-intel)
    runs-on: macos-15-intel
    timeout-minutes: 420
    env:
      CI: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(git tag -l 'v*+canary.*' --sort=-v:refname | head -1)"
          fi
          [ -n "$tag" ] || { echo "::error::no canary tag found"; exit 1; }
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building $tag (version ${tag#v})"

      - name: Report the host
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          xcode-select -p
          /usr/sbin/sysctl -in hw.optional.arm64 || true

      # Spotlight indexes a freshly staged DMG past hdiutil's detach retries
      # ("Resource busy"); the release lane disables it for the same reason.
      - name: Disable Spotlight indexing for DMG staging
        run: sudo mdutil -a -i off || true

      - name: Prepare the locked toolchain
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'

      - name: Prepare the complete desktop build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bundles/desktop.py \
            --tag "${{ steps.tag.outputs.tag }}" \
            --variant bundled --prepare-only \
            --work "$RUNNER_TEMP/desktop-job" \
            --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"
          python -m scripts.ci.desktop_commands "$RUNNER_TEMP/desktop-job/prepared.json"

      - name: Build and package
        shell: bash
        timeout-minutes: 330
        run: |
          set -euo pipefail
          ulimit -n 16384 2>/dev/null || true
          python scripts/bundles/desktop.py --prepared "$RUNNER_TEMP/desktop-job/prepared.json" --variant bundled

      - name: Check the packaged identity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          ((${#apps[@]} == 1)) || { echo "::error::expected exactly one .app, found ${#apps[@]}"; exit 1; }
          app="${apps[0]}"
          echo "app: $app"
          file "$app/Contents/MacOS/"*
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist"; echo
          python3 - "$app" <<'PY'
          import json, re, sys, pathlib
          app = pathlib.Path(sys.argv[1])
          stamp = json.loads((app / "Contents/Resources/install-stamp.json").read_text())
          ident = app.name
          print("stamp:", {k: stamp.get(k) for k in ("payload", "tag", "commit", "dirty")})
          assert stamp["payload"] == "bundled", stamp["payload"]
          assert stamp["dirty"] is False, "build came from a dirty checkout"
          # A commit build is the failure mode this lane exists to avoid.
          assert not re.search(r"[0-9a-f]{7}$", ident), f"commit-build identity: {ident}"
          assert (app / "Contents/Resources/agent-payload").is_dir(), "missing agent-payload"
          print("identity ok:", ident)
          PY

      # The official harness: mounts the artifact, verifies identity against the
      # admitted commit, seeds an isolated home/userData, drives a real chat turn
      # through Playwright, and proves the app did not write into its own bundle.
      - name: Install and chat (official smoke harness)
        shell: bash
        timeout-minutes: 60
        env:
          HERMES_PYTHON: ${{ steps.pm.outputs.python-path }}
        run: |
          set -euo pipefail
          shopt -s globglob nullglob
          artifacts=(apps/desktop/release/*.dmg)
          ((${#artifacts[@]} >= 1)) || { echo "::error::no dmg produced"; exit 1; }
          bash tests/install/macos-bundle-smoke.sh \
            --artifact "$GITHUB_WORKSPACE/${artifacts[0]}" \
            --arch x64 \
            --commit "${{ steps.tag.outputs.commit }}" \
            --tag "${{ steps.tag.outputs.tag }}" \
            --work "$RUNNER_TEMP/smoke/work" \
            --out "$RUNNER_TEMP/smoke/out"

      - name: Upload the smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-x64
          path: |
            ${{ runner.temp }}/smoke/out/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Assemble the release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg apps/desktop/release/*.zip)
          ((${#files[@]} > 0)) || { echo "::error::electron-builder produced no dmg or zip"; exit 1; }
          for f in "${files[@]}"; do cp "$f" out/; done
          ( cd out && shasum -a 256 * > SHA256SUMS.txt )
          ls -lh out
          echo "release=${{ steps.tag.outputs.tag }}-x64" >> "$GITHUB_OUTPUT"

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.artifacts.outputs.release }}"
          gh release create "$tag" out/* \
            --repo "${{ github.repository }}" \
            --title "Hermes Desktop ${tag} (Intel macOS)" \
            --notes "Self-contained (bundled) Hermes Desktop for Intel macOS.

          Built from `${{ steps.tag.outputs.commit }}` at tag `${{ steps.tag.outputs.tag }}`,
          workflow run ${{ github.run_number }}.

          **Verified by `tests/install/macos-bundle-smoke.sh`**: the artifact was mounted,
          its identity checked, an isolated home/userData seeded, and a real chat turn
          driven through Playwright before this release was created.

          Unsigned (no Developer ID). On first launch macOS Gatekeeper will ask:
          right-click the app → Open, or run
          `xattr -dr com.apple.quarantine "Hermes Agent Canary.app"`."
          echo "release: https://github.com/${{ github.repository }}/releases/tag/$tag"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-bundled-x64
          path: |
            ~/.hermes/logs/**
            apps/desktop/release/*.log
          retention-days: 7
          if-no-files-found: ignore
